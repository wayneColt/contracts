<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The exploded diagram</title><style>body{margin:0;background:#f1e9d6;color:#2b271d;font-family:Georgia,serif}.wrap{max-width:1160px;margin:0 auto;padding:24px}

.dash{stroke:#854F0B;stroke-dasharray:4 4;stroke-width:1.5}h1{font:600 1.7rem Georgia,serif;margin:0 0 6px}p{max-width:72ch;line-height:1.55}</style></head><body><div class="wrap"><h1>The exploded diagram</h1><p>One substrate, sold as organs. Each organ is a service that catches one thing, named in the buyer&#x27;s own words; the part that composes them is never sold; the buyer writes the standard before anything runs; the contracts are public and the runner is private.</p><svg viewBox="0 0 1120 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Exploded diagram: modules over a spine against a standard"><g class="std"><rect x="60" y="40" width="1000" height="70" rx="6"/><text x="74" y="66" class="t">THE NAMED STANDARD · the job card</text><text x="74" y="86" class="s">conserved · controllable · hidden · noise — written by the buyer, in the buyer&#x27;s words; Rung 0: it won&#x27;t run till the checklist is written</text></g><text x="60" y="140" class="lbl">DIVISIBLE SURFACE · sold one at a time, in the buyer's language</text><g class="mod live"><rect x="60" y="150" width="190" height="118" rx="6"/><text x="72" y="176" class="t">Voice</text><text x="72" y="198" class="s">“did we miss a booking on”</text><text x="72" y="214" class="s">the phone</text><text x="72" y="256" class="st">measured · runner live · ~$4 a location-month</text></g><g class="mod"><rect x="260" y="150" width="190" height="118" rx="6"/><text x="272" y="176" class="t">Recon</text><text x="272" y="198" class="s">“does what we were billed”</text><text x="272" y="214" class="s">match what we got</text><text x="272" y="256" class="st">declared</text></g><g class="mod"><rect x="460" y="150" width="190" height="118" rx="6"/><text x="472" y="176" class="t">Correspondence</text><text x="472" y="198" class="s">“answer what can be”</text><text x="472" y="214" class="s">answered, escalate what</text><text x="472" y="230" class="s">can&#x27;t</text><text x="472" y="256" class="st">declared</text></g><g class="mod"><rect x="660" y="150" width="190" height="118" rx="6"/><text x="672" y="176" class="t">Document</text><text x="672" y="198" class="s">“pull the fields off the”</text><text x="672" y="214" class="s">scan and tie them to</text><text x="672" y="230" class="s">something</text><text x="672" y="256" class="st">declared</text></g><g class="mod"><rect x="860" y="150" width="190" height="118" rx="6"/><text x="872" y="176" class="t">Books</text><text x="872" y="198" class="s">“categorize it and hand me”</text><text x="872" y="214" class="s">a filing packet</text><text x="872" y="256" class="st">declared</text></g><line x1="560" y1="268" x2="560" y2="318" class="dash"/><text x="572" y="300" class="lbl">the join · prices as a step, not a line</text><g class="spine"><rect x="60" y="320" width="1000" height="84" rx="6"/><text x="74" y="346" class="t">NON-DIVISIBLE SPINE · the part you never buy (the join)</text><text x="74" y="366" class="s">scheduler · wallet · packet router · cross-module join — never sold, never forked; one per tenant (your instance)</text></g><text x="60" y="440" class="lbl">PARTS TRACED FROM THE ESTATE (April → September)</text><g class="trace"><rect x="60" y="450" width="320" height="96" rx="6"/><text x="74" y="476" class="t">what tells us which job to offer next (not running yet)</text><text x="74" y="496" class="s">DORMANT since 2026-03-12 · daemon activation (B3.4) still a keystroke </text></g><text x="74" y="518" class="st">built 2026-01-18 (CK 251-260, 500-511); lives on as the FULC</text><g class="trace"><rect x="396" y="450" width="320" height="96" rx="6"/><text x="410" y="476" class="t">the switchboard between organs</text><text x="410" y="496" class="s">triple-booked · canon verdict 2026-09-07 = Intermediate Precision Core</text></g><text x="410" y="518" class="st">inter-process comm 02-26 · precision cores 07-29 · internal </text><g class="trace"><rect x="732" y="450" width="320" height="96" rx="6"/><text x="746" y="476" class="t">the precise unfinished part (you do the polishing)</text><text x="746" y="496" class="s">LIVE as canon, first part shipped 2026-09-08 · sell the precise unfini</text></g><text x="746" y="518" class="st">defined 07-29 (θ process accuracy ≫ market, φ polish ≪ compe</text><text x="60" y="580" class="lbl">THE PHYSICS (the April corpus, ideas only)</text><g class="law"><rect x="60" y="590" width="480" height="58" rx="6"/><text x="74" y="614" class="t">R = 1 − Π(1−pₙ)</text><text x="74" y="634" class="s">adding a stage never hurts (Apr 11)</text></g><g class="law"><rect x="560" y="590" width="480" height="58" rx="6"/><text x="574" y="614" class="t">dX/dt = λ·X</text><text x="574" y="634" class="s">stored labor compounds only when λ is admitted from outside (Apr 16)</text></g><g class="law"><rect x="60" y="660" width="480" height="58" rx="6"/><text x="74" y="684" class="t">Range(Oᵢ) ⊆ Domain(S)</text><text x="74" y="704" class="s">operational closure: every organ&#x27;s output is the spine&#x27;s input (Apr 16)</text></g><g class="law"><rect x="560" y="660" width="480" height="58" rx="6"/><text x="574" y="684" class="t">C(t+1) = f(C(t), δE)</text><text x="574" y="704" class="s">bootstrap conservation: nothing is created that was not carried (Apr 16)</text></g><g class="sub"><rect x="60" y="740" width="1000" height="70" rx="6"/><text x="74" y="766" class="t">SUBSTRATE · public contract, private runner</text><text x="74" y="786" class="s">public: rubric · packet · in/out schemas · clock · fixture · golden eval · pricing footnotes ➜ github.com/wayneColt/contracts   private: the loop, the composer, the join</text></g><text x="60" y="846" class="st">exploded view · public render (buyer words) · 2026-09-08 · z = 0 · fabricated:false</text></svg></div></body></html>
